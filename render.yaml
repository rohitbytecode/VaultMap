services:
  - type: web
    name: vaultmap-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm turbo run build --filter=@vaultmap/api...
    startCommand: pnpm --filter @vaultmap/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_CALLBACK_URL
        sync: false
      - key: GITHUB_APP_SETUP_URL
        sync: false
      - key: GITHUB_APP_NAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false
